<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Mishka Get Ready!</title>
<style>
  body {
    text-align: center;
    font-family: 'Comic Sans MS', sans-serif;
    background: #ffe6e6;
    margin: 0;
    padding: 20px;
  }

  #game-container {
    position: relative;
    display: inline-block;
    margin-top: 50px;
  }

  #mouse {
    width: 200px;
    position: relative;
    z-index: 1;
  }

  /* Base accessory behavior */
  .accessory {
    position: absolute;
    display: none;
    z-index: 2;
  }

  /* Individual positioning */

  #dress {
    width: 200px;
    top: 0px;
    left: 0px;
  }

  #shoes {
    width: 150px;   /* smaller than mouse */
    top: 140px;     /* adjust up/down */
    left: 25px;     /* adjust left/right */
  }

  #bow {
    width: 90px;
    top: -10px;
    left: 60px;
  }

  .item-button {
    margin: 10px;
    padding: 10px 20px;
    cursor: pointer;
    background: #ff99cc;
    border: none;
    border-radius: 10px;
    font-weight: bold;
  }

  #message {
    margin-top: 20px;
    font-size: 1.2em;
    color: #cc0066;
  }
</style>

</head>
<body>

<h1>Help Mishka get ready for Valentines!</h1>

<div id="game-container">
  <img id="mouse" src="mouse.png" alt="Mouse">
  <img id="dress" class="accessory" src="dress.png" alt="Dress">
  <img id="shoes" class="accessory" src="shoes.png" alt="Shoes">
  <img id="bow" class="accessory" src="bow.png" alt="Bow">
</div>

<div>
  <button class="item-button" onclick="putOn('dress')">Dress</button>
  <button class="item-button" onclick="putOn('shoes')">Shoes</button>
  <button class="item-button" onclick="putOn('bow')">Bow</button>
</div>

<div id="message"></div>

<script>
  let worn = { dress: false, shoes: false, bow: false };

  function putOn(item) {
    document.getElementById(item).style.display = 'block';
    worn[item] = true;

    if (worn.dress && worn.shoes && worn.bow) {
      document.getElementById('message').innerText = "Thanks for helping Mishka get ready for Valentines! Will you be mine?";
    }
  }
</script>

</body>
</html>
